<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bot Cripto - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
      padding: 20px;
    }
    canvas {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }
    .info {
      margin: 20px 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>📈 Bot Cripto - Dashboard em Tempo Real</h1>

  <div class="info">
    <p>💰 Saldo USDT: <span id="usdt">0</span></p>
    <p>₿ Saldo BTC: <span id="btc">0</span></p>
    <p>📊 Lucro Total: <span id="profit">0</span> USDT</p>
    <p>🟢 Última Ação: <span id="action">Aguardando...</span></p>
  </div>

  <canvas id="chart" width="800" height="400"></canvas>

  <script>
    const ctx = document.getElementById("chart").getContext("2d");
    const priceData = [];
    const smaData = [];
    const labels = [];

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "Preço BTC/USDT",
            data: priceData,
            borderColor: "#38bdf8",
            tension: 0.2,
          },
          {
            label: "SMA",
            data: smaData,
            borderColor: "#a78bfa",
            borderDash: [5, 5],
            tension: 0.2,
          },
        ],
      },
      options: {
        scales: {
          x: { ticks: { color: "#94a3b8" } },
          y: { ticks: { color: "#94a3b8" } },
        },
        plugins: {
          legend: {
            labels: { color: "#f8fafc" }
          }
        }
      }
    });

    async function updateDashboard() {
      const res = await fetch("/data");
      const data = await res.json();

      if (!data.price) return;

      const timestamp = new Date(data.timestamp).toLocaleTimeString();
      labels.push(timestamp);
      priceData.push(data.price);
      smaData.push(data.sma);

      if (labels.length > 30) {
        labels.shift();
        priceData.shift();
        smaData.shift();
      }

      chart.update();

      document.getElementById("usdt").textContent = data.balanceUSDT.toFixed(2);
      document.getElementById("btc").textContent = data.balanceBTC.toFixed(6);
      document.getElementById("profit").textContent = data.profitTotal.toFixed(2);
      document.getElementById("action").textContent = data.action;
    }

    setInterval(updateDashboard, 3000);
    setInterval(updateDashboard, 3000); // a cada 3 segundos
  </script>
</body>
</html>
